name: Python CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,data,models]"

      - name: Ruff lint
        run: python -m ruff check .

      - name: Ruff formatting check
        run: python -m ruff format --check .

      - name: Verify Session 3 CLI
        run: python scripts/train_baselines.py --help

      - name: Tests and coverage
        run: python -m pytest -q --cov=productmatch --cov-report=term-missing --cov-fail-under=75

      - name: CLI smoke test
        run: python -m productmatch normalize "Dove Body-Wash 250ML"
