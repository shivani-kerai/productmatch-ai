project:
  name: productmatch-ai
  version: 0.3.0
  phase: session-3-supervised-baselines

dataset:
  name: WDC Products pairwise
  source: https://webdatacommons.org/largescaleproductcorpus/wdc-products/index.html
  raw_data_committed: false
  training: data/processed/wdc50_medium/train.parquet
  validation: data/processed/wdc50_medium/validation_safe.parquet
  test_policy: sealed-until-final-model
  random_seed: 42
