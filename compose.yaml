services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    volumes:
      - ./runtime:/app/runtime
      - ./artifacts:/app/artifacts:ro
      - ./data/processed:/app/data/processed:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 100
    read_only: true
    tmpfs:
      - /tmp:size=64m
    restart: unless-stopped
