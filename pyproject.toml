[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "productmatch-ai"
version = "0.3.0"
description = "Reproducible product matching with leakage-safe supervised baselines."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
keywords = ["entity-resolution", "product-matching", "machine-learning", "mlops"]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.9,<1",
]
data = [
    "pandas>=2.2,<3",
    "pyarrow>=17,<30",
    "scikit-learn>=1.5,<2",
    "matplotlib>=3.9,<4",
]
models = [
    "lightgbm>=4.5,<5",
    "joblib>=1.4,<2",
]

[project.scripts]
productmatch = "productmatch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
